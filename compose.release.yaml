# Production-style compose file. Pulls pre-built images from GHCR
# instead of building locally — pin a specific version via the
# `AKASHIC_VERSION` environment variable, or default to `latest`.
#
# Usage:
#   AKASHIC_VERSION=v0.1.0 docker compose -f compose.release.yaml up -d
#
# All other services (postgres / meilisearch / redis / tika) are
# inherited from the upstream images they're already pinned to in
# compose.yaml, so this file is the *minimum diff* for using
# pre-built akashic images. Networking, volumes, and healthchecks
# match compose.yaml exactly so you can swap between dev and release
# without losing data.

services:
  # First-run secret generator. Writes random Postgres + Meilisearch
  # secrets into the `secrets` volume (idempotent: existing files are
  # kept). Upgrading with an existing Postgres volume? Run once with
  # POSTGRES_PASSWORD (and optionally MEILI_MASTER_KEY) set to the old
  # values; they are written over the generated ones.
  init:
    image: alpine:3.20
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    command:
      - sh
      - -ec
      - |
        umask 022
        gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        put() { # name, override
          if [ -n "$$2" ]; then printf '%s' "$$2" > "/secrets/$$1"
          elif [ ! -s "/secrets/$$1" ]; then gen > "/secrets/$$1"; fi
        }
        put postgres_password "$$POSTGRES_PASSWORD"
        put meili_key "$$MEILI_MASTER_KEY"
    volumes:
      - secrets:/secrets
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: akashic
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_DB: akashic
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akashic"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_NO_ANALYTICS: "true"
    # The image has no *_FILE support; read the key from the secrets volume.
    entrypoint: ["tini", "--", "sh", "-c", "MEILI_MASTER_KEY=$$(cat /secrets/meili_key) exec /bin/meilisearch"]
    volumes:
      - msdata:/meili_data
      - secrets:/secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # v0.30.0 — Tika serves the bundled SCANNER (text extraction moved
  # into the scanner). Profile-gated to "scanner" so the central API
  # stack doesn't start a Tika it never calls. For remote scanner
  # hosts, deploy compose.scanner.yaml (scanner + co-located Tika)
  # instead of the bundled scanner here.
  tika:
    image: apache/tika:3.0.0.0
    ports:
      - "127.0.0.1:9998:9998"
    # bash /dev/tcp probe — the apache/tika image ships neither wget
    # nor curl, only bash + java.
    healthcheck:
      test: ["CMD", "bash", "-c",
             "exec 3<>/dev/tcp/localhost/9998; printf 'GET /tika HTTP/1.0\\r\\n\\r\\n' >&3; grep -q 'Apache Tika' <&3"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    profiles: ["scanner"]

  api:
    image: ghcr.io/metril/akashic-api:${AKASHIC_VERSION:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEILI_URL: http://meilisearch:7700
      REDIS_URL: redis://redis:6379/0
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Read once for the legacy-env -> web-UI settings import on upgrade.
    # Optional; safe to delete .env afterwards.
    env_file:
      - path: .env
        required: false
    volumes:
      - apidata:/data   # secret.key (JWT signing key), auto-generated on first boot
      - secrets:/secrets:ro
    # DATABASE_URL / MEILI_KEY are built from the generated secrets.
    command:
      - sh
      - -c
      - |
        PGPW="$$(python -c 'import urllib.parse;print(urllib.parse.quote(open("/secrets/postgres_password").read().strip(),safe=""))')"
        export DATABASE_URL="postgresql+asyncpg://akashic:$$PGPW@postgres:5432/akashic"
        export MEILI_KEY="$$(cat /secrets/meili_key)"
        exec uvicorn akashic.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "$$FORWARDED_ALLOW_IPS"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness — flips green the moment uvicorn is accepting
    # connections. Used by `scanner.depends_on` so the agent doesn't
    # race the api on cold start. python3 (no curl in the runtime
    # image) hits the unauthenticated /health endpoint.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    image: ghcr.io/metril/akashic-web:${AKASHIC_VERSION:-latest}
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Bundled scanner agent. v0.3.0+ uses the `auto` entrypoint so
  # the same compose service works on every install state:
  #
  #   - First run, want operator-approved discovery:
  #       AKASHIC_DISCOVER=1 docker compose -f compose.release.yaml \
  #         --profile scanner up -d scanner
  #     → stderr shows a pairing code; approve in Settings → Scanners.
  #
  #   - First run, have a join token (from Settings → Scanners):
  #       AKASHIC_CLAIM_TOKEN=akcl_… docker compose -f compose.release.yaml \
  #         --profile scanner up -d scanner
  #
  #   - Subsequent runs (credentials persisted in the named volume):
  #       docker compose -f compose.release.yaml --profile scanner up -d scanner
  #     → auto detects the saved key+id and runs `agent` directly.
  #
  # Uses a named docker volume (scanner-data) so the container can
  # write its generated keypair on first run without host-uid
  # ceremony. Pre-v0.3.0 installs with files in
  # ./secrets/default-scanner/ — see compose.yaml's migration notes.
  scanner:
    image: ghcr.io/metril/akashic-scanner:${AKASHIC_VERSION:-latest}
    command: [auto]
    environment:
      AKASHIC_API_URL: http://api:8000
      AKASHIC_DISCOVER: ${AKASHIC_DISCOVER:-}
      AKASHIC_CLAIM_TOKEN: ${AKASHIC_CLAIM_TOKEN:-}
      SCANNER_ID: ${SCANNER_ID:-}
    volumes:
      - scanner-data:/secrets
    depends_on:
      api:
        # Wait for /health, not just for the container to start.
        # Without this the scanner POSTs to /api/v1/scanners/discover
        # before uvicorn is bound and gets connection-refused on
        # first try. The retry-with-backoff in `auto`/discover/claim
        # would still recover, but waiting up front is cleaner.
        condition: service_healthy
      tika:
        condition: service_healthy
    profiles: ["scanner"]

  # Optional Prometheus scraper for the akashic_* metrics that the
  # api exposes at /metrics (v0.4.3). Profile-gated:
  #   docker compose -f compose.release.yaml --profile metrics up -d prometheus
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["metrics"]
    depends_on:
      - api

volumes:
  secrets:
  apidata:
  pgdata:
  msdata:
  redisdata:
  scanner-data:
  prometheusdata:
