# Regenerate: make openapi   (go tool oapi-codegen -config internal/apiclient/oapi-codegen.yaml ../openapi.json)
package: apiclient
output: internal/apiclient/apiclient.gen.go
generate:
  models: true
  client: true
output-options:
  include-tags:
    - search
    - sources
    - scans
    - duplicates
    - tags
    - purge
    - users
    - analytics
  response-type-suffix: Reply
